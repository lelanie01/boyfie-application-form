[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
    from = "/api/admin/login"
    to = "/.netlify/functions/admin-login"
    status = 200

  [[redirects]]
    from = "/api/applications"
    to = "/.netlify/functions/applications"
    status = 200

  [[redirects]]
    from = "/api/recordings"
    to = "/.netlify/functions/recordings"
    status = 200

  [[redirects]]
    from = "/*"
    to = "/index.html"
  status = 200
